name: test mssql
on: 
  push:
    branches:
      - main
      - v1
  pull_request:

jobs:
  test-mssql:
    name: test mssql
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: wait for mssql
        run: |
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/mssql/1433) >/dev/null 2>&1; then
              # SQL Server can accept TCP before it is fully ready for queries.
              sleep 15
              exit 0
            fi
            sleep 5
          done
          echo "mssql did not become ready in time"
          exit 1
      - name: test mssql
        env:
          TEST_MSSQL_HOST: mssql
          TEST_MSSQL_DBNAME: xorm_test
          TEST_MSSQL_USERNAME: sa
          TEST_MSSQL_PASSWORD: "yourStrong(!)Password"
        run: TEST_MSSQL_DEFAULT_VARCHAR=NVARCHAR TEST_MSSQL_DEFAULT_CHAR=NCHAR make test-mssql

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: yourStrong(!)Password
          MSSQL_PID: Standard
