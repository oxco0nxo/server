name: test mysql8
on: 
  push:
    branches:
      - main
      - v1
  pull_request:

jobs:
  lint:
    name: test mysql8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: wait for mysql8 service
        run: |
          for i in $(seq 1 15); do
            (echo > /dev/tcp/mysql8/3306) &>/dev/null && echo "MySQL is ready!" && break
            echo "Waiting for MySQL... ($i/15)"
            [ $i -eq 15 ] && echo "MySQL failed to start in time!" && exit 1
            sleep 1
          done
      - name: test mysql8
        env:
          TEST_MYSQL_HOST: mysql8
          TEST_MYSQL_CHARSET: utf8mb4
          TEST_MYSQL_DBNAME: xorm_test
          TEST_MYSQL_USERNAME: root
          TEST_MYSQL_PASSWORD:
        run: TEST_CACHE_ENABLE=true make test-mysql

    services:
      mysql8:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: xorm_test